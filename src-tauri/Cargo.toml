[package]
name = "chronos-shadow"
version = "0.1.0"
edition = "2021"
description = "Chronos-Shadow (时空之影) - Windows 桌面智能体研发与协同工具"
authors = ["Chronos-Shadow Team"]

[package.metadata]
# Tauri build metadata

[lib]
name = "chronos_shadow_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
thiserror = "2"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
chrono = "0.4"
sha2 = "0.10"
aes-gcm = "0.10"
keyring = "3"
regex = "1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"

[profile.release]
panic = "abort"
codegen-units = 4
lto = false
opt-level = 1
strip = true
