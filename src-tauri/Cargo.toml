[package]
name = "chronos-shadow"
version = "0.5.0"
edition = "2021"
description = "Chronos-Shadow (时空之影) - Windows 桌面智能体研发与协同工具"
authors = ["Chronos-Shadow Team"]
license = "Apache-2.0"
repository = "https://github.com/cnkevinbai/Chronos-Shadow"
homepage = "https://github.com/cnkevinbai/Chronos-Shadow"
documentation = "https://github.com/cnkevinbai/Chronos-Shadow"

[package.metadata]
# Tauri build metadata

[lib]
name = "chronos_shadow_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
thiserror = "2"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
chrono = "0.4"
sha2 = "0.10"
aes-gcm = "0.10"
keyring = { version = "3", features = ["windows-native"] }
regex = "1"
base64 = "0.22"
regex-lite = "0.1"
indexmap = "=1.9.2"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
panic = "abort"
codegen-units = 4
lto = false
opt-level = 1
strip = true
