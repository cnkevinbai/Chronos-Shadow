name: Chronos-Shadow CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      # WiX v3 is auto-downloaded by the Tauri CLI to %LOCALAPPDATA%\tauri\WixTools
      # when bundling MSI — no manual install step needed (and setting WIX to a
      # non-existent path would suppress the auto-download).

      - name: Build (frontend + Rust + MSI)
        run: node node_modules/@tauri-apps/cli/tauri.js build --bundles msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chronos-Shadow-Windows-x64
          path: src-tauri/target/release/bundle/msi/*.msi

  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (tauri::generate_context! 需要 dist/)
        run: npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
