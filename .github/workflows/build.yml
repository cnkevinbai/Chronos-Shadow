name: Chronos-Shadow CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (required for Tauri compilation)
        run: npm run build

      - name: Add WiX Toolset to PATH
        run: echo "$env:WIX\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        env:
          WIX: "C:\\Program Files (x86)\\WiX Toolset v3.11"

      - name: Cargo check (Rust type-check only)
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Tauri build (release + MSI bundle)
        run: npx tauri build --bundles msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chronos-Shadow-Windows-x64
          path: src-tauri/target/release/bundle/msi/*.msi
